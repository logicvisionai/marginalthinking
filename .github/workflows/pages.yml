name: Deploy Marginal Thinking to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore published assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/2026/09
          cat .packed-assets/2026-09-14/report-pdf/part-* | base64 --decode > reports/2026/09/Relatorio_Macro_Mercados_Risco_Politico_Global_2026-09-14.pdf
          cat .packed-assets/2026-09-14/report-xlsx/part-* | base64 --decode > reports/2026/09/Global_Macro_Political_Risk_Chart_Data_2026-09-14.xlsx
          test -s reports/2026/09/Relatorio_Macro_Mercados_Risco_Politico_Global_2026-09-14.pdf
          test -s reports/2026/09/Global_Macro_Political_Risk_Chart_Data_2026-09-14.xlsx
          rm -rf .packed-assets
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
