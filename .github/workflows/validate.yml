name: Validate Marginal Thinking

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate and build
        run: npm run build

      - name: Verify research visual semantics
        run: node --test tests/research-visuals.test.mjs

      - name: Verify generated site
        run: |
          test -f dist/index.html
          test -f dist/reports.html
          test -f dist/research/index.html
          test -f dist/opportunities/index.html
          test -f dist/pt-br/opportunities/index.html
          test -f dist/data/structural-opportunities.json
          test -f dist/regions/index.html
          test -f dist/research/coverage/index.html
          test -f dist/pt-br/research/coverage/index.html
          test -f dist/research/hubs/index.html
          test -f dist/pt-br/research/hubs/index.html
          test -f dist/research/global-macro/index.html
          test -f dist/pt-br/research/global-macro/index.html
          test -f dist/research/global-macro/2026/index.html
          test -f dist/pt-br/research/global-macro/2026/index.html
          grep -q 'mainEntity' dist/research/global-macro/index.html
          grep -q 'ItemList' dist/research/global-macro/index.html
          grep -R -q 'research-hub-link' dist/reports
          test -f dist/data/index.html
          test -f dist/pt-br/data/index.html
          test -f dist/data/global-dependencies/index.html
          test -f dist/pt-br/data/global-dependencies/index.html
          test -f dist/what-is-marginal-thinking/index.html
          test -f dist/pt-br/what-is-marginal-thinking/index.html
          grep -q 'What is Marginal Thinking?' dist/what-is-marginal-thinking/index.html
          grep -q 'O que é Marginal Thinking?' dist/pt-br/what-is-marginal-thinking/index.html
          test -f dist/actors/blackrock/index.html
          test -f dist/pt-br/actors/blackrock/index.html
          grep -q 'mainEntity' dist/actors/blackrock/index.html
          grep -q '"@type":"Dataset"' dist/data/global-dependencies/index.html
          grep -q 'DataDownload' dist/data/global-dependencies/index.html
          test -f dist/data/research-intelligence.json
          test -f dist/data/search-index.json
          test -f dist/data/mcp-catalog.json
          test -f dist/_headers
          grep -q '^/data/mcp-catalog.json$' dist/_headers
          grep -q 'Access-Control-Allow-Origin: \*' dist/_headers
          test -f dist/mcp-docs/index.html
          test -f dist/pt-br/mcp-docs/index.html
          test ! -f dist/mcp.html
          test ! -f dist/pt-br/mcp.html
          test -f dist/assets/css/mcp-docs.css
          test -f dist/search.html
          test -f dist/pt-br/search.html
          test -f dist/assets/js/global-search.js
          test -f dist/assets/js/strategic-actors.js
          test -f dist/assets/css/discovery.css
          grep -q 'nav-dropdown' dist/index.html
          grep -q 'data-locale="pt-BR"' dist/index.html
          grep -q 'actors-explorer' dist/actors/index.html
          grep -q 'data-actor-cell' dist/actors/index.html
          grep -q 'actor-inspector' dist/pt-br/actors/index.html
          grep -q 'marginal-thinking-locale' dist/assets/js/app.js
          node -e 'const fs=require("fs");const s=fs.readFileSync("dist/assets/js/app.js","utf8");if(/for\\s*\\([^)]*\\bof\\s+\\$\\([^)]*\\)\\)/.test(s)){console.error("Non-iterable querySelector used in for...of");process.exit(1)}'
          test -f dist/assets/og/marginal-thinking-en.png
          test -f dist/assets/og/marginal-thinking-pt-br.png
          test -f dist/series/energy-materials-industrial-systems/index.html
          test -f dist/pt-br/series/energy-materials-industrial-systems/index.html
          test -f dist/data/taxonomy.json
          grep -q 'research-intelligence-entry' dist/research/index.html
          grep -q 'structural-opportunity-atlas' dist/opportunities/index.html
          grep -q 'structural-opportunity-atlas' dist/pt-br/opportunities/index.html
          grep -q 'research-intelligence-entry' dist/pt-br/research/index.html
          grep -q 'global-search-link' dist/index.html
          grep -q 'home-tools-grid' dist/index.html
          grep -q 'tool-matrix' dist/index.html
          grep -q 'home-tools-grid' dist/pt-br/index.html
          grep -q 'tool-matrix' dist/pt-br/index.html
          grep -q '@media(max-width:760px)' dist/assets/css/research-home.css
          test -f dist/workspace/index.html
          test -f dist/pt-br/workspace/index.html
          test -f dist/assets/js/research-store.js
          test -f dist/assets/js/research-actions.js
          test -f dist/assets/js/research-workspace.js
          test -f dist/assets/js/annotations-store.js
          test -f dist/assets/js/annotation-layer.js
          test -f dist/assets/js/workspace-annotations.js
          test -f dist/assets/css/annotations.css
          test -f dist/assets/css/research-workspace.css
          node --check dist/assets/js/annotations-store.js
          node --check dist/assets/js/annotation-layer.js
          node --check dist/assets/js/workspace-annotations.js
          grep -q 'mobile-menu-toolbar' dist/index.html
          grep -q '/assets/js/annotation-layer.js' dist/index.html
          grep -q 'data-annotation-styles' dist/index.html
          grep -q 'mt-notes-drawer.*hidden' dist/assets/js/annotation-layer.js
          grep -q '.mt-notes-drawer\[hidden\]' dist/assets/css/annotations.css
          grep -q 'id="annotations-view"' dist/workspace/index.html
          grep -q 'workspace-annotations.js' dist/workspace/index.html
          grep -q 'id="annotations-view"' dist/pt-br/workspace/index.html
          node scripts/validate-research-product.mjs
          grep -q 'global-search-link' dist/pt-br/index.html
          grep -R -q 'semantic-navigation' dist/reports
          grep -R -q 'semantic-navigation' dist/pt-br/reports
          grep -q '<a class="tag" href=' dist/reports.html
          grep -q '<a class="tag" href=' dist/pt-br/reports.html
          grep -q '.semantic-chip,.chips a,.tags a.tag' dist/assets/css/discovery.css
          grep -q '/mcp-docs/' dist/index.html
          grep -q '/pt-br/mcp-docs/' dist/pt-br/index.html
          grep -q 'https://marginalthinking.org/mcp' dist/mcp-docs/index.html
          grep -q 'https://marginalthinking.org/mcp' dist/pt-br/mcp-docs/index.html
          grep -q '<loc>https://marginalthinking.org/mcp-docs/</loc>' dist/sitemap.xml
          grep -q '<loc>https://marginalthinking.org/pt-br/mcp-docs/</loc>' dist/sitemap.xml
          grep -q '<loc>https://marginalthinking.org/research/global-macro/</loc>' dist/sitemap.xml
          grep -q '<loc>https://marginalthinking.org/pt-br/research/global-macro/</loc>' dist/sitemap.xml
          grep -q '<loc>https://marginalthinking.org/data/global-dependencies/</loc>' dist/sitemap.xml
          grep -q '<loc>https://marginalthinking.org/pt-br/data/global-dependencies/</loc>' dist/sitemap.xml
          ! grep -R -q 'https://www.marginalthinking.org' dist --include='*.html' --include='*.xml' --include='*.json' --include='*.txt'
          grep -q '"mainEntity"' dist/authors/christian-rafael-de-souza-silva/index.html
          grep -q '#person' dist/authors/christian-rafael-de-souza-silva/index.html
          ! grep -R -q '/mcp.html' dist --include='*.html' --include='*.xml' --include='*.json'
          node -e "const x=require('./dist/data/search-index.json'); if(!x.locales?.en?.length||!x.locales?.['pt-BR']?.length) process.exit(1); const en=x.locales.en.find(i=>i.id==='page:mcp'); const pt=x.locales['pt-BR'].find(i=>i.id==='page:mcp'); if(!en||!pt||en.url!=='/mcp-docs/'||pt.url!=='/pt-br/mcp-docs/') process.exit(1)"
          node -e "const x=require('./dist/data/mcp-catalog.json'); if(!x.items?.length||!x.items.every(i=>i.id&&i.views&&Object.keys(i.views).length)) process.exit(1)"
          echo "Static site validation completed."

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
